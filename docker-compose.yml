version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sams_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sams_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sams_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: sams_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres:5432/sams_db"
      DATABASE_SYNC_URL: "postgresql://postgres:postgrespassword@postgres:5432/sams_db"
      ENVIRONMENT: "production"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: sams_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

